<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 468" width="820" height="468" role="img" aria-labelledby="title-del desc-del">
  <title id="title-del">Webhook router failure, timeout, and retry semantics</title>
  <desc id="desc-del">Decision matrix showing router-level error codes (503 unseeded secret, 400 bad signature, 500 discovery error) versus per-environment fan-out outcomes (retry once on connection errors or 502/503/504, never retry timeouts, always return 200 to Stripe after fan-out).</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    </style>
    <marker id="d-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#56b4e9"/>
    </marker>
    <marker id="d-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#00b887"/>
    </marker>
  </defs>

  <!-- Outer card -->
  <rect x="0.5" y="0.5" width="819" height="467" rx="16" fill="#181715" stroke="#302d29"/>

  <text x="28" y="36" class="sans" font-size="14" font-weight="700" fill="#f5f2eb">Failure Boundaries: What Fails at the Gate vs. Inside Fan-Out</text>
  <text x="792" y="36" text-anchor="end" class="mono" font-size="11" fill="#857f76">Stripe timeout ~10s · budget 8s</text>

  <!-- TOP BAND: Gate checks (Router-level responses to Stripe) -->
  <rect x="24" y="54" width="772" height="122" rx="12" fill="#201e1b" stroke="#35322d"/>
  <text x="40" y="76" class="sans" font-size="11.5" font-weight="700" fill="#b5afa6">1. GATE CHECKS (ROUTER RESPONDS DIRECTLY TO STRIPE)</text>

  <!-- Gate 1: 503 -->
  <rect x="40" y="90" width="236" height="72" rx="9" fill="#292622" stroke="#e69f00" stroke-opacity="0.7"/>
  <rect x="52" y="102" width="44" height="20" rx="5" fill="#3a2f15" stroke="#e69f00" stroke-opacity="0.6"/>
  <text x="74" y="116" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f6c453">503</text>
  <text x="106" y="116" class="sans" font-size="12" font-weight="600" fill="#f5f2eb">Placeholder secret</text>
  <text x="52" y="138" class="sans" font-size="11" fill="#b5afa6">Router deployed, not seeded yet.</text>
  <text x="52" y="153" class="sans" font-size="11" fill="#857f76">Fail closed until operator runs CLI.</text>

  <!-- Gate 2: 400 -->
  <rect x="292" y="90" width="236" height="72" rx="9" fill="#292622" stroke="#e06324" stroke-opacity="0.7"/>
  <rect x="304" y="102" width="44" height="20" rx="5" fill="#3a2319" stroke="#e06324" stroke-opacity="0.6"/>
  <text x="326" y="116" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f39362">400</text>
  <text x="358" y="116" class="sans" font-size="12" font-weight="600" fill="#f5f2eb">Invalid signature</text>
  <text x="304" y="138" class="sans" font-size="11" fill="#b5afa6">Bad HMAC or timestamp &gt; 300s.</text>
  <text x="304" y="153" class="sans" font-size="11" fill="#857f76">Drop immediately; do not fan out.</text>

  <!-- Gate 3: 500 -->
  <rect x="544" y="90" width="236" height="72" rx="9" fill="#292622" stroke="#e06324" stroke-opacity="0.7"/>
  <rect x="556" y="102" width="44" height="20" rx="5" fill="#3a2319" stroke="#e06324" stroke-opacity="0.6"/>
  <text x="578" y="116" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f39362">500</text>
  <text x="610" y="116" class="sans" font-size="12" font-weight="600" fill="#f5f2eb">Discovery failed</text>
  <text x="556" y="138" class="sans" font-size="11" fill="#b5afa6">DynamoDB lookup errored out.</text>
  <text x="556" y="153" class="sans" font-size="11" fill="#857f76">Router outage; Stripe should retry.</text>

  <!-- Arrow from Gate to Fan-out -->
  <line x1="410" y1="176" x2="410" y2="206" stroke="#56b4e9" stroke-width="1.8" marker-end="url(#d-blue)"/>
  <text x="424" y="196" class="mono" font-size="10.5" fill="#56b4e9">gate passed → fan out (4s / attempt, 8s total)</text>

  <!-- MIDDLE BAND: Per-target outcomes -->
  <rect x="24" y="214" width="772" height="154" rx="12" fill="#201e1b" stroke="#35322d"/>
  <text x="40" y="236" class="sans" font-size="11.5" font-weight="700" fill="#b5afa6">2. PER-ENVIRONMENT DELIVERY OUTCOMES (ISOLATED PER PR)</text>

  <!-- Outcome 1: 2xx -->
  <rect x="40" y="250" width="174" height="102" rx="9" fill="#182a24" stroke="#00b887" stroke-opacity="0.7"/>
  <text x="52" y="272" class="mono" font-size="11.5" font-weight="700" fill="#4fd9ae">2xx OK</text>
  <text x="52" y="294" class="sans" font-size="11.5" font-weight="600" fill="#f5f2eb">Delivered</text>
  <text x="52" y="314" class="sans" font-size="10.5" fill="#b5afa6">Record success.</text>
  <text x="52" y="330" class="sans" font-size="10.5" fill="#b5afa6">Done for this PR.</text>

  <!-- Outcome 2: Conn / 502-504 -->
  <rect x="228" y="250" width="178" height="102" rx="9" fill="#2b2619" stroke="#e69f00" stroke-opacity="0.8"/>
  <text x="240" y="272" class="mono" font-size="11.5" font-weight="700" fill="#f6c453">Conn err / 502-504</text>
  <text x="240" y="294" class="sans" font-size="11.5" font-weight="600" fill="#f5f2eb">Retry once</text>
  <text x="240" y="314" class="sans" font-size="10.5" fill="#b5afa6">App never got it.</text>
  <text x="240" y="330" class="sans" font-size="10.5" fill="#b5afa6">Safe within 8s budget.</text>

  <!-- Outcome 3: Timeout -->
  <rect x="420" y="250" width="178" height="102" rx="9" fill="#321f18" stroke="#e06324" stroke-width="1.4"/>
  <text x="432" y="272" class="mono" font-size="11.5" font-weight="700" fill="#f39362">Timeout (&gt; 4s)</text>
  <text x="432" y="294" class="sans" font-size="11.5" font-weight="700" fill="#f5f2eb">Never retry</text>
  <text x="432" y="314" class="sans" font-size="10.5" fill="#e5c7b8">May already be running.</text>
  <text x="432" y="330" class="sans" font-size="10.5" fill="#e5c7b8">Retry = double-apply risk.</text>

  <!-- Outcome 4: 4xx / 500 -->
  <rect x="612" y="250" width="168" height="102" rx="9" fill="#292622" stroke="#524d46"/>
  <text x="624" y="272" class="mono" font-size="11.5" font-weight="700" fill="#b5afa6">4xx / 500</text>
  <text x="624" y="294" class="sans" font-size="11.5" font-weight="600" fill="#f5f2eb">Do not retry</text>
  <text x="624" y="314" class="sans" font-size="10.5" fill="#b5afa6">Broken branch or</text>
  <text x="624" y="330" class="sans" font-size="10.5" fill="#b5afa6">unowned event.</text>

  <!-- Arrow to final 200 -->
  <line x1="410" y1="368" x2="410" y2="396" stroke="#00b887" stroke-width="1.8" marker-end="url(#d-green)"/>

  <!-- BOTTOM BAND: Always 200 -->
  <rect x="24" y="404" width="772" height="44" rx="10" fill="#14322a" stroke="#00b887" stroke-width="1.3"/>
  <rect x="38" y="414" width="44" height="24" rx="6" fill="#00b887" fill-opacity="0.2" stroke="#00b887"/>
  <text x="60" y="430" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#4fd9ae">200</text>
  <text x="96" y="430" class="sans" font-size="12.5" font-weight="600" fill="#f5f2eb">Always return 200 to Stripe once fan-out was attempted</text>
  <text x="780" y="430" text-anchor="end" class="mono" font-size="10.5" fill="#8ee8c8">+ CloudWatch EMF log line</text>
</svg>
